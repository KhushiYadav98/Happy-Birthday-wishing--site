<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
  <meta name="theme-color" content="#f7e4dc" />
  <title>Birthday Surprise</title>
  <link rel="preload" as="image" href="Images/creatorbackground.png" />
  <link rel="stylesheet" href="css/style.css?v=8" />
</head>
<body>
  <main class="screen landing" id="landing">
    <!-- falling confetti layer -->
    <div class="confetti" aria-hidden="true"></div>

    <section class="landing__content">
      <img
        class="landing__title"
        src="Images/creatortitle.png"
        alt="Create a little surprise for someone you love"
      />

      <button class="landing__button" id="startBtn" type="button" aria-label="Let's make it">
        <img src="Images/creatorbutton.png" alt="" />
      </button>
    </section>
  </main>

  <script src="js/landing.js?v=2"></script>
</body>
</html>
