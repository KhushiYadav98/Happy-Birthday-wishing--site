<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
  <meta name="theme-color" content="#fef9ed" />
  <title>A Birthday Surprise</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Patrick+Hand&family=Baloo+2:wght@700;800&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="css/style.css?v=13" />
</head>
<body>
  <main class="screen photo" id="photo">
    <div class="confetti" aria-hidden="true"></div>

    <div class="photo__state" id="loadingState">
      <p class="photo__loadingText">Unwrapping your surprise… 🎁</p>
    </div>

    <div class="photo__state" id="errorState" hidden>
      <p class="photo__loadingText">Hmm, we couldn't find this surprise 💔</p>
    </div>

    <div class="photo__reveal" id="reveal" hidden role="button" tabindex="0" aria-label="Tap to continue">
      <div class="photo__frame">
        <img class="photo__picture" id="cardPhoto" alt="" />
        <img class="photo__sticker" src="Images/receiverBirthdaySticker.png" alt="" />
      </div>

      <p class="photo__name" id="cardName"></p>
      <p class="photo__hint">Tap to continue →</p>
    </div>
  </main>

  <script type="module" src="js/photo.js?v=2"></script>
</body>
</html>
