<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
  <meta name="theme-color" content="#fef9ed" />
  <title>Surprise Ready</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Patrick+Hand&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="css/style.css?v=13" />
</head>
<body>
  <main class="screen share" id="share">
    <div class="linkbox" id="linkbox">
      <img class="linkbox__art" src="Images/creatorlinkbox.png" alt="" />

      <input
        class="linkbox__input"
        id="linkInput"
        type="text"
        readonly
        aria-label="Shareable link"
      />
      <button class="linkbox__copy" id="copyBtn" type="button" aria-label="Copy link"></button>
    </div>

    <a class="share__again" href="create.html">← Create another surprise</a>

    <div class="toast" id="toast" role="status" aria-live="polite"></div>
  </main>

  <script type="module" src="js/share.js?v=1"></script>
</body>
</html>
