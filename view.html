<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
  <meta name="theme-color" content="#fef9ed" />
  <title>A Birthday Surprise</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Patrick+Hand&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="css/style.css?v=13" />
</head>
<body>
  <main class="screen screen--scroll view" id="view">
    <div class="confetti" aria-hidden="true"></div>

    <div class="view__state" id="loadingState">
      <p class="view__loadingText">Unwrapping your surprise… 🎁</p>
    </div>

    <div class="view__state" id="errorState" hidden>
      <p class="view__loadingText">Hmm, we couldn't find this surprise 💔</p>
    </div>

    <article class="view__card" id="card" hidden>
      <h1 class="view__heading">
        Happy Birthday, <span id="cardName"></span>! 🎂
      </h1>

      <img class="view__photo" id="cardPhoto" alt="" />

      <p class="view__message" id="cardMessage"></p>

      <div class="view__memories" id="cardMemories"></div>
    </article>
  </main>

  <script type="module" src="js/view.js?v=1"></script>
</body>
</html>
